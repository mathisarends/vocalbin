[project]
name = "vocalbin"
version = "0.6.0"
description = "Typed async speech, realtime transcription, and translation adapters"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=2.46.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.2",
]

[project.optional-dependencies]
realtime = [
    "websockets>=13,<16",
]
audio = [
    "sounddevice>=0.5.1",
    "websockets>=13,<16",
]
cartesia = [
    "cartesia[websockets]>=3.5.1,<4",
]
piper = [
    "piper-tts>=1.3.0,<2",
]
deepgram = [
    "deepgram-sdk>=5,<6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "python-dotenv>=1.1.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = [
    "--cov=vocalbin",
    "--cov-branch",
    "--cov-report=term-missing",
    "--cov-fail-under=100",
]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
